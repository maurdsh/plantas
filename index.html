<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ambiente Natural Vivo</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    font-family: Arial;
    transition: background 2s ease;
}

/* TEXTO */
#mensaje {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #333;
}

/* BARRA */
#barra {
    position: fixed;
    right: 0;
    top: 0;
    width: 25px;
    height: 100vh;
}
#nivel {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(#4caf50, #ffeb3b, #f44336);
    transition: height 0.5s ease;
}

/* 🌱 PLANTA */
.planta {
    position: absolute;
    bottom: 0;
    width: 12px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.3);
    transform-origin: bottom center;
    animation: viento 3s ease-in-out infinite;
}

@keyframes viento {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(4deg); }
    100% { transform: rotate(0deg); }
}

/* 🌿 HOJAS */
.hoja {
    position: absolute;
    width: 26px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.3);
}

/* 🌷 TULIPÁN */
.tulipan {
    position: absolute;
    top: -35px;
}
.tulipan .petalo {
    width: 10px;
    height: 25px;
    border-radius: 50% 50% 30% 30%;
    position: absolute;
    background: pink;
    border: 1px solid rgba(0,0,0,0.3);
}
.tulipan .p1 { left:0; transform: rotate(-20deg); }
.tulipan .p2 { left:8px; }
.tulipan .p3 { left:16px; transform: rotate(20deg); }

/* 🌼 MARGARITAS */
.margarita {
    position: absolute;
    top: -35px;
    width: 30px;
    height: 30px;
}

.margarita .petalo {
    position: absolute;
    width: 6px;
    height: 14px;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform-origin: center -8px;
    border: 1px solid rgba(0,0,0,0.3);
}

.blanca .petalo { background: white; }
.amarilla .petalo { background: gold; }

/* ☁️ NUBES */
.nube {
    position: absolute;
    width: 180px;
    height: 90px;
    background: white;
    border-radius: 100px;
    filter: blur(12px);
    opacity: 0.7;
    transition: all 3s ease;
}
.nube.sucia { background: #555; }

</style>
</head>

<body>

<div id="mensaje">Haz ruido o guarda silencio 🎤</div>
<div id="barra"><div id="nivel"></div></div>

<!-- 🎧 AUDIO -->
<audio id="musica" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="ruido" loop>
    <source src="ruid.mp3" type="audio/mpeg">
</audio>

<script>
let suavizado = 0;
let plantas = [];
let nubes = [];

function lerp(a,b,t){ return a+(b-a)*t; }

/* 🌱 PLANTAS */
for(let i=0;i<6;i++){
    let p=document.createElement("div");
    p.className="planta";
    p.style.left=(i*15+10)+"%";

    for(let j=0;j<4;j++){
        let h=document.createElement("div");
        h.className="hoja";
        h.style.left=(j%2==0?"-20px":"20px");
        h.style.top=(30+j*30)+"px";
        p.appendChild(h);
    }

    document.body.appendChild(p);
    plantas.push(p);
}

/* ☁️ NUBES */
for(let i=0;i<6;i++){
    let n=document.createElement("div");
    n.className="nube";
    n.style.left=Math.random()*90+"%";
    n.style.top=(50+Math.random()*150)+"px";
    document.body.appendChild(n);
    nubes.push(n);
}

/* 🌸 FLORES */
function crearFlor(){
    let tipo=Math.floor(Math.random()*3);

    if(tipo===0){
        let f=document.createElement("div");
        f.className="tulipan";
        for(let i=0;i<3;i++){
            let p=document.createElement("div");
            p.className="petalo p"+(i+1);
            f.appendChild(p);
        }
        return f;
    }

    if(tipo===1){
        let f=document.createElement("div");
        f.className="margarita blanca";
        for(let i=0;i<10;i++){
            let p=document.createElement("div");
            p.className="petalo";
            p.style.transform = `rotate(${i*36}deg) translate(0,-10px)`;
            f.appendChild(p);
        }
        return f;
    }

    let f=document.createElement("div");
    f.className="margarita amarilla";
    for(let i=0;i<10;i++){
        let p=document.createElement("div");
        p.className="petalo";
        p.style.transform = `rotate(${i*36}deg) translate(0,-10px)`;
        f.appendChild(p);
    }
    return f;
}

/* 🎤 MICRO + AUDIO */
async function iniciar(){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new AudioContext();
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();

    src.connect(analyser);
    analyser.fftSize=256;

    const data=new Uint8Array(analyser.frequencyBinCount);

    const musica = document.getElementById("musica");
    const ruido = document.getElementById("ruido");

    // 🔑 activar audio con click
    document.body.addEventListener("click", () => {
        musica.play();
        ruido.play();
    });

    function loop(){
        analyser.getByteFrequencyData(data);
        let vol=data.reduce((a,b)=>a+b,0)/data.length;

        suavizado=lerp(suavizado,vol,0.05);
        actualizar(suavizado, musica, ruido);

        requestAnimationFrame(loop);
    }
    loop();
}

function actualizar(v, musica, ruido){
    let silencio=Math.max(0,100-v*2);

    document.getElementById("mensaje").innerText =
        silencio>60 ? "Silencio 🌱 Aire limpio" : "Ruido 😷 Contaminación";

    document.getElementById("nivel").style.height=Math.min(v*2,100)+"%";

    /* 🎧 AUDIO DINÁMICO */
    let nivel = silencio / 100;

    musica.volume = nivel * 0.8;     // sube con silencio
    ruido.volume = (1 - nivel) * 0.5; // sube con ruido

    /* 🌱 PLANTAS */
    plantas.forEach(p=>{
        let altura=lerp(parseFloat(p.style.height)||0,silencio*3,0.08);
        p.style.height=altura+"px";

        let verde=120+silencio;
        let rojo=200-silencio;
        let color=`rgb(${rojo},${verde},70)`;

        p.style.background=color;
        p.querySelectorAll(".hoja").forEach(h=>h.style.background=color);

        let flor=p.querySelector(".flor");

        if(altura>180){
            if(!flor){
                let f=crearFlor();
                f.classList.add("flor");
                p.appendChild(f);
            }
        }else{
            if(flor) flor.remove();
        }
    });

    /* ☁️ NUBES */
    nubes.forEach(n=>{
        let actual=parseFloat(n.style.top);

        let objetivo=silencio>60
            ? 30+Math.random()*40
            : 150+Math.random()*120;

        n.style.top=lerp(actual,objetivo,0.02)+"px";

        if(silencio<60){
            n.classList.add("sucia");
        }else{
            n.classList.remove("sucia");
        }
    });

    /* 🌤️ FONDO */
    let limpio = silencio / 100;
    let nubesSucias = nubes.filter(n => n.classList.contains("sucia")).length;
    let t = limpio * (1 - nubesSucias / nubes.length);

    let limpioColor = [135,206,250];
    let sucioColor = [255,214,98];

    let r = sucioColor[0] + (limpioColor[0]-sucioColor[0])*t;
    let g = sucioColor[1] + (limpioColor[1]-sucioColor[1])*t;
    let b = sucioColor[2] + (limpioColor[2]-sucioColor[2])*t;

    document.body.style.background = `
    linear-gradient(
        rgb(${r},${g},${b}),
        rgb(${r+30},${g+20},${b})
    )`;
}

iniciar();
</script>

</body>
</html>
