<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ambiente Natural Estético</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    transition: background 2s ease;
}

/* TEXTO */
#mensaje {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #333;
}

/* BARRA */
#barra {
    position: fixed;
    right: 0;
    top: 0;
    width: 25px;
    height: 100vh;
    background: rgba(0,0,0,0.08);
}
#nivel {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(#4caf50, #ffeb3b, #f44336);
    transition: height 0.5s ease;
}

/* 🌱 PLANTA */
.planta {
    position: absolute;
    bottom: 0;
    width: 12px;
    border-radius: 12px;
    transform-origin: bottom;
    transition: height 1.5s ease;
}

/* 🌿 HOJAS */
.hoja {
    position: absolute;
    width: 26px;
    height: 12px;
    border-radius: 50%;
}

/* 🌷 TULIPÁN */
.flor {
    position: absolute;
    width: 26px;
    height: 40px;
    top: -35px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}

/* pétalos */
.petalo {
    position: absolute;
    width: 12px;
    height: 25px;
    background: linear-gradient(pink, hotpink);
    border-radius: 50% 50% 40% 40%;
}

/* tres pétalos */
.petalo:nth-child(1){ left:0; transform: rotate(-20deg);}
.petalo:nth-child(2){ left:7px; }
.petalo:nth-child(3){ left:14px; transform: rotate(20deg);}

/* 🌬️ movimiento suave */
@keyframes viento {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(2deg); }
    100% { transform: rotate(0deg); }
}

.planta {
    animation: viento 4s ease-in-out infinite;
}

/* ☁️ NUBE DIFUMINADA */
.nube {
    position: absolute;
    width: 180px;
    height: 90px;
    background: white;
    border-radius: 100px;
    filter: blur(12px); /* clave para suavizar */
    opacity: 0.7;
    transition: all 3s ease;
}

/* 🌫️ CONTAMINACIÓN */
.nube.sucia {
    background: #555;
    opacity: 0.6;
}
</style>
</head>
<body>

<div id="mensaje">Haz ruido o guarda silencio 🎤</div>
<div id="barra"><div id="nivel"></div></div>

<script>
let suavizado = 0;
let plantas = [];
let nubes = [];

function lerp(a,b,t){ return a+(b-a)*t; }

/* 🌱 CREAR PLANTAS CON MÁS HOJAS */
for(let i=0;i<6;i++){
    let p=document.createElement("div");
    p.className="planta";
    p.style.left=(i*15+10)+"%";

    /* hojas múltiples */
    for(let j=0;j<4;j++){
        let h=document.createElement("div");
        h.className="hoja";
        h.style.left = (j%2==0 ? "-20px" : "20px");
        h.style.top = (30 + j*30) + "px";
        p.appendChild(h);
    }

    document.body.appendChild(p);
    plantas.push(p);
}

/* ☁️ NUBES DIFUMINADAS Y ALEATORIAS */
for(let i=0;i<6;i++){
    let n=document.createElement("div");
    n.className="nube";
    n.style.left=Math.random()*90+"%";
    n.style.top=(50+Math.random()*150)+"px";
    document.body.appendChild(n);
    nubes.push(n);
}

async function iniciar(){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new AudioContext();
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();

    src.connect(analyser);
    analyser.fftSize=256;

    const data=new Uint8Array(analyser.frequencyBinCount);

    function loop(){
        analyser.getByteFrequencyData(data);
        let vol=data.reduce((a,b)=>a+b,0)/data.length;

        suavizado=lerp(suavizado,vol,0.05);

        actualizar(suavizado);
        requestAnimationFrame(loop);
    }
    loop();
}

function actualizar(v){
    let silencio=Math.max(0,100-v*2);

    /* TEXTO */
    document.getElementById("mensaje").innerText =
        silencio>60 ? "Silencio 🌱 Aire limpio" : "Ruido 😷 Contaminación";

    /* BARRA */
    document.getElementById("nivel").style.height=Math.min(v*2,100)+"%";

    /* 🌱 PLANTAS */
    plantas.forEach(p=>{
        let altura=lerp(parseFloat(p.style.height)||0,silencio*3,0.08);
        p.style.height=altura+"px";

        let verde=120+silencio;
        let rojo=200-silencio;
        let color=`rgb(${rojo},${verde},70)`;

        p.style.background=color;
        p.querySelectorAll(".hoja").forEach(h=>h.style.background=color);

        let flor=p.querySelector(".flor");

        if(altura>180){
            if(!flor){
                let f=document.createElement("div");
                f.className="flor";

                /* pétalos */
                for(let i=0;i<3;i++){
                    let pet=document.createElement("div");
                    pet.className="petalo";
                    f.appendChild(pet);
                }

                p.appendChild(f);
            }
        }else{
            if(flor) flor.remove();
        }
    });

    /* ☁️ NUBES SUAVES */
    nubes.forEach(n=>{
        let actual=parseFloat(n.style.top);

        let objetivo = silencio > 60
            ? 30 + Math.random()*40
            : 150 + Math.random()*120;

        n.style.top = lerp(actual, objetivo, 0.02) + "px";

        if(silencio < 60){
            n.classList.add("sucia");
        }else{
            n.classList.remove("sucia");
        }
    });

    /* FONDO */
    document.body.style.background=`linear-gradient(
        rgb(${200-silencio/2},${220-silencio/3},255),
        rgb(${230-silencio/2},${255-silencio/4},255)
    )`;
}

iniciar();
</script>

</body>
</html>
