<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ambiente Natural Suave</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    transition: background 2s ease;
}

/* TEXTO */
#mensaje {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #333;
    transition: opacity 1s;
}

/* BARRA */
#barra {
    position: fixed;
    right: 0;
    top: 0;
    width: 25px;
    height: 100vh;
    background: rgba(0,0,0,0.08);
}
#nivel {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(#4caf50, #ffeb3b, #f44336);
    transition: height 0.5s ease;
}

/* 🌱 PLANTAS MÁS ALTAS */
.planta {
    position: absolute;
    bottom: 0;
    width: 14px;
    border-radius: 14px;
    transition: all 1.5s ease;
}

.hoja {
    position: absolute;
    width: 26px;
    height: 14px;
    border-radius: 50%;
}

.flor {
    position: absolute;
    width: 32px;
    height: 32px;
    background: radial-gradient(circle, pink, hotpink);
    border-radius: 50%;
    top: -25px;
}

/* ☁️ NUBE REAL (3 capas) */
.nube {
    position: absolute;
    width: 160px;
    height: 80px;
    pointer-events: none;
    transition: top 3s ease, transform 3s ease, opacity 2s ease;
}

.nube div {
    position: absolute;
    background: white;
    border-radius: 50%;
}

/* forma */
.nube .c1 { width: 60px; height: 60px; left: 0; top: 20px; }
.nube .c2 { width: 80px; height: 80px; left: 40px; top: 0; }
.nube .c3 { width: 60px; height: 60px; left: 90px; top: 20px; }

/* 🌫️ versión contaminada */
.nube.sucia div {
    background: radial-gradient(circle, #777, #222);
}
</style>
</head>
<body>

<div id="mensaje">Haz ruido o guarda silencio 🎤</div>
<div id="barra"><div id="nivel"></div></div>

<script>
let suavizado = 0;
let plantas = [];
let nubes = [];

function lerp(a,b,t){ return a+(b-a)*t; }

/* 🌱 CREAR PLANTAS */
for(let i=0;i<6;i++){
    let p=document.createElement("div");
    p.className="planta";
    p.style.left=(i*15+10)+"%";

    let h1=document.createElement("div");
    h1.className="hoja";
    h1.style.left="-20px"; h1.style.top="40px";

    let h2=document.createElement("div");
    h2.className="hoja";
    h2.style.right="-20px"; h2.style.top="80px";

    p.appendChild(h1); p.appendChild(h2);
    document.body.appendChild(p);
    plantas.push(p);
}

/* ☁️ CREAR NUBES REALES Y ALEATORIAS */
for(let i=0;i<6;i++){
    let n=document.createElement("div");
    n.className="nube";

    let c1=document.createElement("div");
    let c2=document.createElement("div");
    let c3=document.createElement("div");

    c1.className="c1"; c2.className="c2"; c3.className="c3";

    n.appendChild(c1); n.appendChild(c2); n.appendChild(c3);

    n.style.left=Math.random()*90+"%";
    n.style.top=(50+Math.random()*120)+"px";

    document.body.appendChild(n);
    nubes.push(n);
}

async function iniciar(){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new AudioContext();
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();

    src.connect(analyser);
    analyser.fftSize=256;

    const data=new Uint8Array(analyser.frequencyBinCount);

    function loop(){
        analyser.getByteFrequencyData(data);
        let vol=data.reduce((a,b)=>a+b,0)/data.length;

        suavizado=lerp(suavizado,vol,0.05);

        actualizar(suavizado);
        requestAnimationFrame(loop);
    }
    loop();
}

function actualizar(v){

    let silencio=Math.max(0,100-v*2);

    /* TEXTO */
    let msg=document.getElementById("mensaje");
    msg.innerText=silencio>60 ? "Silencio 🌱 Aire limpio" : "Ruido 😷 Contaminación";

    /* BARRA */
    document.getElementById("nivel").style.height=Math.min(v*2,100)+"%";

    /* 🌱 PLANTAS MÁS ALTAS */
    plantas.forEach(p=>{
        let altura=lerp(parseFloat(p.style.height)||0,silencio*3,0.08);
        p.style.height=altura+"px";

        let verde=120+silencio;
        let rojo=200-silencio;
        let color=`rgb(${rojo},${verde},70)`;

        p.style.background=color;
        p.querySelectorAll(".hoja").forEach(h=>h.style.background=color);

        let flor=p.querySelector(".flor");
        if(altura>180){
            if(!flor){
                let f=document.createElement("div");
                f.className="flor";
                p.appendChild(f);
            }
        }else{
            if(flor) flor.remove();
        }
    });

    /* ☁️ NUBES QUE SUBEN SUAVE */
    nubes.forEach(n=>{
        let actual=parseFloat(n.style.top);

        let objetivo = silencio > 60
            ? 30 + Math.random()*50     // cielo limpio (arriba)
            : 150 + Math.random()*120;  // contaminación (más abajo)

        let nuevo = lerp(actual, objetivo, 0.02);
        n.style.top = nuevo + "px";

        /* CAMBIO DE TIPO */
        if(silencio < 60){
            n.classList.add("sucia");
        }else{
            n.classList.remove("sucia");
        }
    });

    /* FONDO */
    document.body.style.background=`linear-gradient(
        rgb(${200-silencio/2},${220-silencio/3},255),
        rgb(${230-silencio/2},${255-silencio/4},255)
    )`;
}

iniciar();
</script>

</body>
</html>
