<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ambiente Natural Vivo</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    font-family: Arial, sans-serif;
    transition: background 1.5s ease;
}

/* TEXTO SUPERIOR */
#mensaje {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #333;
    z-index: 5;
}

/* BARRA SONIDO */
#barra {
    position: fixed;
    right: 0;
    top: 0;
    width: 25px;
    height: 100vh;
}
#nivel {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(#4caf50, #ffeb3b, #f44336);
    transition: height 0.4s ease;
}

/* 🌱 PLANTA */
.planta {
    position: absolute;
    bottom: 0;
    width: 12px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.3);
    transform-origin: bottom center;
    animation: viento 3s ease-in-out infinite;
}

@keyframes viento {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(4deg); }
    100% { transform: rotate(0deg); }
}

/* HOJAS */
.hoja {
    position: absolute;
    width: 26px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.3);
}

/* 🌷 TULIPÁN */
.tulipan {
    position: absolute;
    top: -35px;
}
.tulipan .petalo {
    width: 10px;
    height: 25px;
    border-radius: 50% 50% 30% 30%;
    position: absolute;
    background: pink;
    border: 1px solid rgba(0,0,0,0.3);
}
.tulipan .p1 { left:0; transform: rotate(-20deg); }
.tulipan .p2 { left:8px; }
.tulipan .p3 { left:16px; transform: rotate(20deg); }

/* 🌼 MARGARITAS */
.margarita {
    position: absolute;
    top: -35px;
    width: 30px;
    height: 30px;
}
.margarita .petalo {
    position: absolute;
    width: 6px;
    height: 14px;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform-origin: center -8px;
    border: 1px solid rgba(0,0,0,0.3);
}
.blanca .petalo { background: white; }
.amarilla .petalo { background: gold; }

/* ☁️ NUBES */
.nube {
    position: absolute;
    width: 180px;
    height: 90px;
    background: white;
    border-radius: 100px;
    filter: blur(12px);
    opacity: 0.7;
    transition: all 3s ease;
}
.nube.sucia {
    background: #555;
}

/* 🎛️ PANELES */
#configPanel, #resultadoPanel {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.7);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#resultadoPanel {
    display:none;
}

#configPanel input {
    padding:10px;
    font-size:18px;
    margin:10px;
}

#configPanel button, #resultadoPanel button {
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

/* CONTROLES */
#controles {
    display:none;
    position: fixed;
    top:10px;
    left:10px;
    z-index:10;
}
#timer {
    font-size:24px;
    color:white;
    margin-top:5px;
}
</style>
</head>

<body>

<div id="mensaje">Configura la actividad 🌱</div>
<div id="barra"><div id="nivel"></div></div>

<!-- AUDIO -->
<audio id="musica" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>
<audio id="ruido" loop>
    <source src="ruid.mp3" type="audio/mpeg">
</audio>

<!-- CONFIG -->
<div id="configPanel">
    <h2>¿Cuántos minutos?</h2>
    <input type="number" id="tiempoInput" placeholder="Ej: 2" min="1">
    <button onclick="iniciarActividad()">Comenzar</button>
</div>

<!-- RESULTADO -->
<div id="resultadoPanel">
    <h1 id="resultadoTexto"></h1>
    <button onclick="reiniciarTodo()">Reintentar</button>
</div>

<!-- CONTROLES -->
<div id="controles">
    <button onclick="pausar()">⏸️</button>
    <button onclick="reiniciarTodo()">🔄</button>
    <div id="timer"></div>
</div>

<script>
let estado = "config";

let plantas = [];
let nubes = [];

let suavizado = 0;

let tiempoTotal = 0;
let tiempoRestante = 0;

let tiempoSilencio = 0;
let tiempoRuido = 0;

let pausado = false;
let ultimoFrame = Date.now();

let rSuave = 135, gSuave = 206, bSuave = 250;

function lerp(a,b,t){ return a+(b-a)*t; }

/* 🌱 CREAR PLANTAS */
for(let i=0;i<6;i++){
    let p=document.createElement("div");
    p.className="planta";
    p.style.left=(i*15+10)+"%";

    for(let j=0;j<4;j++){
        let h=document.createElement("div");
        h.className="hoja";
        h.style.left=(j%2==0?"-20px":"20px");
        h.style.top=(30+j*30)+"px";
        p.appendChild(h);
    }

    document.body.appendChild(p);
    plantas.push(p);
}

/* ☁️ NUBES */
for(let i=0;i<6;i++){
    let n=document.createElement("div");
    n.className="nube";
    n.style.left=Math.random()*90+"%";
    n.style.top=(50+Math.random()*150)+"px";
    document.body.appendChild(n);
    nubes.push(n);
}

/* 🌸 FLORES */
function crearFlor(){
    let tipo=Math.floor(Math.random()*3);

    if(tipo===0){
        let f=document.createElement("div");
        f.className="tulipan";
        for(let i=0;i<3;i++){
            let p=document.createElement("div");
            p.className="petalo p"+(i+1);
            f.appendChild(p);
        }
        return f;
    }

    let f=document.createElement("div");
    f.className = Math.random() > 0.5 ? "margarita blanca" : "margarita amarilla";

    for(let i=0;i<10;i++){
        let p=document.createElement("div");
        p.className="petalo";
        p.style.transform = `rotate(${i*36}deg) translate(0,-10px)`;
        f.appendChild(p);
    }
    return f;
}

/* 🎤 INICIAR */
async function iniciarActividad(){
    let min = parseInt(document.getElementById("tiempoInput").value);
    if(!min || min<=0){ alert("Tiempo inválido"); return; }

    tiempoTotal = min * 60;
    tiempoRestante = tiempoTotal;

    estado = "run";

    document.getElementById("configPanel").style.display="none";
    document.getElementById("controles").style.display="block";

    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();

    src.connect(analyser);
    analyser.fftSize=256;

    const data=new Uint8Array(analyser.frequencyBinCount);

    const musica = document.getElementById("musica");
    const ruido = document.getElementById("ruido");

    document.body.addEventListener("click", ()=>{
        musica.play();
        ruido.play();
    });

    function loop(){
    analyser.getByteFrequencyData(data);

    let vol = data.reduce((a,b)=>a+b,0)/data.length;

    suavizado = lerp(suavizado, vol, 0.05);

    actualizar(suavizado, musica, ruido);

    requestAnimationFrame(loop);
}
    loop();
}

/* 🔄 ACTUALIZAR */
function actualizar(v, musica, ruido){

    let pausadoLocal = (estado === "paused");

    let ahora = Date.now();
    let delta = (ahora - ultimoFrame)/1000;
    ultimoFrame = ahora;

    let silencio = Math.max(0,100-v*2);

    if(!pausadoLocal){
    tiempoRestante -= delta;
}

    document.getElementById("timer").innerText =
        Math.ceil(tiempoRestante)+"s";
    document.getElementById("nivel").style.height = Math.min(v*5,100)+"%";

    let nivelBarra = v * 4;

let color = "green";

if(nivelBarra > 60) color = "red";
else if(nivelBarra > 30) color = "yellow";

let barra = document.getElementById("nivel");
barra.style.height = Math.min(nivelBarra,100)+"%";
barra.style.background = color;

    if(!pausadoLocal){
    if(silencio>60){
        tiempoSilencio += delta;
    } else {
        tiempoRuido += delta;
    }
}

    /* AUDIO */
    let nivel = silencio/100;
    musica.volume = nivel*0.8;
    ruido.volume = (1-nivel)*0.5;

    /* PLANTAS */
    plantas.forEach(p=>{
        let altura=lerp(parseFloat(p.style.height)||0,silencio*3,0.08);
        p.style.height=altura+"px";

        let verde=120+silencio;
        let rojo=200-silencio;
        let color=`rgb(${rojo},${verde},70)`;

        p.style.background=color;
        p.querySelectorAll(".hoja").forEach(h=>h.style.background=color);

        let flor=p.querySelector(".flor");

        if(altura>180){
            if(!flor){
                let f=crearFlor();
                f.classList.add("flor");
                p.appendChild(f);
            }
        }else{
            if(flor) flor.remove();
        }
    });

    /* NUBES */
    nubes.forEach(n=>{
        let actual=parseFloat(n.style.top);
        let objetivo=silencio>60?40:200;
        n.style.top=lerp(actual,objetivo,0.02)+"px";

        if(silencio<60) n.classList.add("sucia");
        else n.classList.remove("sucia");
    });

    /* FONDO */
    let limpio = silencio/100;
    let sucioColor=[255,214,98];
    let limpioColor=[135,206,250];

    let rT=sucioColor[0]+(limpioColor[0]-sucioColor[0])*limpio;
    let gT=sucioColor[1]+(limpioColor[1]-sucioColor[1])*limpio;
    let bT=sucioColor[2]+(limpioColor[2]-sucioColor[2])*limpio;

    rSuave=lerp(rSuave,rT,0.03);
    gSuave=lerp(gSuave,gT,0.03);
    bSuave=lerp(bSuave,bT,0.03);

    document.body.style.background =
    `linear-gradient(rgb(${rSuave},${gSuave},${bSuave}),
                     rgb(${rSuave+30},${gSuave+20},${bSuave}))`;

    if(tiempoRestante<=0){
        terminar();
    }
}

/* 🧮 RESULTADO */
function terminar(){
    estado="result";

    let total = tiempoSilencio+tiempoRuido;
    let p = (tiempoSilencio/total)*100;

    let texto = p>=60 ?
        "🌱 "+p.toFixed(0)+"% Silencio ¡Excelente!" :
        "😷 "+p.toFixed(0)+"% Silencio Intenten mejorar";

    document.getElementById("resultadoTexto").innerText=texto;
    document.getElementById("resultadoPanel").style.display="flex";
}

/* ⏸️ */
function pausar(){
    estado = estado==="paused" ? "run" : "paused";
}

/* 🔄 */
function reiniciarTodo(){
    location.reload();
}
</script>

</body>
</html>
