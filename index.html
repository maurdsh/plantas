<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ambiente Vivo Mejorado</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    transition: background 2s ease;
}

/* TEXTO */
#mensaje {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #333;
    transition: opacity 1s;
}

/* BARRA */
#barra {
    position: fixed;
    right: 0;
    top: 0;
    width: 25px;
    height: 100vh;
    background: rgba(0,0,0,0.08);
}
#nivel {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(#4caf50, #ffeb3b, #f44336);
    transition: height 0.5s ease;
}

/* PLANTAS */
.planta {
    position: absolute;
    bottom: 0;
    width: 12px;
    border-radius: 12px;
    transition: all 1s ease;
}

.hoja {
    position: absolute;
    width: 22px;
    height: 12px;
    border-radius: 50%;
}

/* FLOR GRANDE */
.flor {
    position: absolute;
    width: 28px;
    height: 28px;
    background: radial-gradient(circle, pink, hotpink);
    border-radius: 50%;
    top: -20px;
    animation: aparecer 1s ease;
}

@keyframes aparecer {
    from { opacity: 0; transform: scale(0.5);}
    to { opacity: 1; transform: scale(1);}
}

/* NUBES LIMPIAS */
.nube {
    position: absolute;
    width: 160px;
    height: 80px;
    background: white;
    border-radius: 100px;
    opacity: 0.85;
    filter: blur(2px);
    transition: all 2s ease;
}

/* NUBES CONTAMINADAS */
.nube.sucia {
    background: radial-gradient(circle, #777, #222);
    opacity: 0.7;
    filter: blur(3px);
}
</style>
</head>
<body>

<div id="mensaje">Haz ruido o guarda silencio 🎤</div>
<div id="barra"><div id="nivel"></div></div>

<script>
let suavizado = 0;
let plantas = [];
let nubes = [];

function lerp(a, b, t) {
    return a + (b - a) * t;
}

/* PLANTAS */
for (let i = 0; i < 6; i++) {
    let p = document.createElement("div");
    p.className = "planta";
    p.style.left = (i * 15 + 10) + "%";

    let h1 = document.createElement("div");
    h1.className = "hoja";
    h1.style.left = "-18px";
    h1.style.top = "30px";

    let h2 = document.createElement("div");
    h2.className = "hoja";
    h2.style.right = "-18px";
    h2.style.top = "60px";

    p.appendChild(h1);
    p.appendChild(h2);

    document.body.appendChild(p);
    plantas.push(p);
}

/* NUBES */
for (let i = 0; i < 5; i++) {
    let n = document.createElement("div");
    n.className = "nube";
    n.style.left = (i * 20) + "%";
    n.style.top = (60 + i * 20) + "px";
    document.body.appendChild(n);
    nubes.push(n);
}

async function iniciar() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();

    src.connect(analyser);
    analyser.fftSize = 256;

    const data = new Uint8Array(analyser.frequencyBinCount);

    function loop() {
        analyser.getByteFrequencyData(data);

        let suma = data.reduce((a,b)=>a+b,0);
        let volumen = suma / data.length;

        suavizado = lerp(suavizado, volumen, 0.05);

        actualizarEscena(suavizado);

        requestAnimationFrame(loop);
    }

    loop();
}

function actualizarEscena(v) {
    let silencio = Math.max(0, 100 - v * 2);

    /* TEXTO */
    let msg = document.getElementById("mensaje");
    msg.innerText = silencio > 60 ? "Silencio 🌱 Aire limpio" : "Ruido 😷 Contaminación";

    /* BARRA */
    document.getElementById("nivel").style.height = Math.min(v * 2, 100) + "%";

    /* PLANTAS */
    plantas.forEach(p => {
        let altura = lerp(parseFloat(p.style.height)||0, silencio * 2, 0.08); // MÁS ALTAS
        p.style.height = altura + "px";

        let verde = 120 + silencio;
        let rojo = 200 - silencio;

        let color = `rgb(${rojo},${verde},70)`;
        p.style.background = color;

        p.querySelectorAll(".hoja").forEach(h=>{
            h.style.background = color;
        });

        let flor = p.querySelector(".flor");

        if (altura > 140) {
            if (!flor) {
                let f = document.createElement("div");
                f.className = "flor";
                p.appendChild(f);
            }
        } else {
            if (flor) flor.remove();
        }
    });

    /* NUBES DINÁMICAS */
    nubes.forEach((n, i) => {
        let targetY = 60 + (100 - silencio) * 2 + i * 15;
        let actualY = parseFloat(n.style.top);
        n.style.top = lerp(actualY, targetY, 0.05) + "px";

        /* CAMBIO A CONTAMINACIÓN */
        if (silencio < 50) {
            n.classList.add("sucia");
        } else {
            n.classList.remove("sucia");
        }
    });

    /* FONDO */
    document.body.style.background = `linear-gradient(
        rgb(${200 - silencio/2}, ${220 - silencio/3}, 255),
        rgb(${230 - silencio/2}, ${255 - silencio/4}, 255)
    )`;
}

iniciar();
</script>

</body>
</html>
